<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="node_modules/swiper/swiper-bundle.min.css" />
  <link rel="stylesheet" href="src/style.css" />
  <title>Fantastics</title>
</head>

<body>
  <!-- container -->
  <div class="h-full overflow-clip scroll-smooth">
    <!-- sticky-area -->
    <div class="h-full">
      <!-- top-pinned-banner for offer's banner -->
      <div id="top" class="hidden lg:block sticky top-0 lg:z-500">
        <img class="w-full h-[35px] lg:h-[60px] inline-block object-cover"
          src="public/images/static-banners/top-pinned-banner.jpg"
          alt="تا 235 میلیون تومان >جایزه برای همه بدون قرعه کشی" />
      </div>
      <!-- top-pinned-banner end -->
      <!-- header including mobile and desktop headers -->
      <header class="sticky top-0 lg:top-[60px] right-0 z-500 bg-white">
        <!-- mobile header -->
        <div class="w-full h-[64px] px-5 py-4 bg-[rgb(239,57,78)] flex flex-row items-center justify-between lg:hidden">
          <a href="index.html">
            <svg style="width: 24px; height: 24px; fill: rgb(255, 255, 255)">
              <path fill-rule="evenodd"
                d="M12.707 19.707l-1.414-1.414L16.586 13H4v-2h12.586l-5.293-5.293 1.414-1.414 7 7a1 1 0 010 1.414l-7 7z"
                clip-rule="evenodd"></path>
            </svg>
          </a>
          <div>
            <img src="public/svg/fantastic-page-header-logo.svg" alt="پیشنهاد‌ شگفت‌انگیز" />
          </div>
          <div>
            <svg style="width: 24px; height: 24px; fill: rgb(255, 255, 255)">
              <path fill-rule="evenodd"
                d="M10.5 18a7.5 7.5 0 115.973-2.963l4.369 4.246-1.394 1.434-4.387-4.263A7.467 7.467 0 0110.5 18zm5.5-7.5a5.5 5.5 0 11-11 0 5.5 5.5 0 0111 0z"
                clip-rule="evenodd"></path>
            </svg>
          </div>
        </div>
        <!-- mobile header end -->
        <!-- desktop header end -->
        <div></div>
        <!-- desktop header end -->
      </header>
      <!-- header end -->
    </div>
    <!-- sticky-area end -->
    <!-- fixed elements -->
    <!-- mobile-bottom-navigation-menu -->
    <div class="lg:hidden w-full h-[54.5px] bg-white fixed bottom-0 right-0 z-500">
      <div class="w-full h-full flex flex-row items-center">
        <div class="w-full h-full py-1 flex flex-col items-center justify-center flex-1">
          <svg style="width: 24px; height: 24px; fill: rgb(66, 71, 80)">
            <path
              d="M20 11.586v6.586a3 3 0 01-3 3H7a3 3 0 01-3-3v-6.586l-1.293 1.293-1.414-1.415L9.879 2.88a3 3 0 014.242 0l8.586 8.585-1.414 1.415L20 11.586z">
            </path>
          </svg>
          <div class="font-iranYekanBold text-[10px] leading-[21.7px] text-[rgb(66,71,80)]">
            خانه
          </div>
        </div>
        <div class="w-full h-full py-1 flex flex-col items-center justify-center flex-1">
          <svg style="width: 24px; height: 24px; fill: rgb(161, 163, 168)">
            <path fill-rule="evenodd"
              d="M10 2H3a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V3a1 1 0 00-1-1zM4 9V4h5v5H4zm17 4a1 1 0 011 1v7a1 1 0 01-1 1h-7a1 1 0 01-1-1v-7a1 1 0 011-1h7zm-3.5-2a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM20 6.5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM6.5 22a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM9 17.5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zm6 2.5v-5h5v5h-5z"
              clip-rule="evenodd"></path>
          </svg>
          <div class="font-iranYekanBold text-[10px] leading-[21.7px] text-[rgb(161,163,168)]">
            دسته‌بندی
          </div>
        </div>
        <div class="w-full h-full py-1 flex flex-col items-center justify-center flex-1">
          <svg style="width: 24px; height: 24px; fill: rgb(161, 163, 168)">
            <path fill-rule="evenodd"
              d="M20 4h2V2h-3a1 1 0 00-1 1v1H3a1 1 0 00-.995 1.1l1 10A1 1 0 004 16h15a1 1 0 001-1V4zm-2 17a2 2 0 110-4 2 2 0 010 4zM5 21a2 2 0 110-4 2 2 0 010 4zm13-7V6H4.105l.8 8H18z"
              clip-rule="evenodd"></path>
          </svg>
          <div class="font-iranYekanBold text-[10px] leading-[21.7px] text-[rgb(161,163,168)]">
            سبد خرید
          </div>
        </div>
        <div class="w-full h-full py-1 flex flex-col items-center justify-center flex-1">
          <div class="pl-[1px]">
            <img class="w-[21px] h-[21px]" src="public/images/logo/magnet.png" alt="" />
          </div>
          <div class="font-iranYekanBold text-[10px] leading-[21.7px] text-[rgb(161,163,168)]">
            مگنت
          </div>
        </div>
        <div class="w-full h-full py-1 flex flex-col items-center justify-center flex-1">
          <svg style="width: 24px; height: 24px; fill: rgb(161, 163, 168)">
            <path fill-rule="evenodd"
              d="M12 2a5 5 0 015 5v1A5 5 0 017 8V7a5 5 0 015-5zm9.996 18.908C21.572 16.318 18.096 14 12 14c-6.095 0-9.572 2.318-9.996 6.908A1 1 0 003 22h18a1 1 0 00.996-1.092zM4.188 20c.728-2.677 3.231-4 7.812-4 4.58 0 7.084 1.323 7.812 4H4.188zM9 7a3 3 0 116 0v1a3 3 0 01-6 0V7z"
              clip-rule="evenodd"></path>
          </svg>
          <div class="font-iranYekanBold text-[10px] leading-[21.7px] text-[rgb(161,163,168)]">
            دیجی‌کالای من
          </div>
        </div>
      </div>
    </div>
    <!-- mobile-bottom-navigation-menu end -->
    <!-- support for desktop -->
    <div class="p-3 hidden lg:block fixed right-[50px] bottom-[32px] rounded-full bg-[rgb(239,64,86)] z-10">
      <div>
        <svg style="width: 24px; height: 24px; fill: rgb(255, 255, 255)">
          <path fill-rule="evenodd"
            d="M18 17a4.001 4.001 0 01-3.14 3.907A3 3 0 1012 23h2a6 6 0 006-6v-.256a4.502 4.502 0 000-8.488V7a6 6 0 00-6-6h-4a6 6 0 00-6 6v1.256A4.502 4.502 0 005.5 17H7a1 1 0 001-1V9a1 1 0 00-1-1H6V7a4 4 0 014-4h4a4 4 0 014 4v1h-1a1 1 0 00-1 1v7a1 1 0 001 1h1zm.5-2H18v-5h.5a2.5 2.5 0 010 5zM6 10h-.5a2.5 2.5 0 000 5H6v-5zm7 10a1 1 0 11-2 0 1 1 0 012 0z"
            clip-rule="evenodd"></path>
        </svg>
      </div>
    </div>
    <!-- support for desktop end -->
    <!-- fixed elements end -->
  </div>
  <!-- container end -->
  <script src="node_modules/swiper/swiper-bundle.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
